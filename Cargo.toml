[package]
name = "krypto"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "Secure in-memory secret handling, AEAD at rest, and process hardening."
repository = "https://github.com/rjorgensen123/krypto"
license = "MIT OR Apache-2.0"
authors = ["Roger Jorgensen <rogerj@gmail.com>"]
keywords = ["secrets", "zeroize", "mlock", "aegis256", "encryption"]
categories = ["cryptography", "memory-management", "command-line-utilities"]
# CI configuration and the Python binding are not part of the crate, so they are
# never packaged.
exclude = [".gitea/", ".github/", "krypto-py/"]
# The crate is published on crates.io, and only there: the list refuses any other
# destination outright.
publish = ["crates-io"]

# The repository is a workspace: the library at the root, and the Python binding
# in `krypto-py/`, built and tested against the same code (0.8.0).
[workspace]
members = ["krypto-py"]

[dependencies]
libc = "0.2"
zeroize = "1"
getrandom = "0.4"
aegis = "0.9.20"
chacha20poly1305 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
argon2 = "0.6"
subtle = "2"
ed25519-dalek = "3"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }

# argon2 in debug builds is painfully slow (the High preset costs ~30 s per
# hash); optimize just that dependency so `cargo test` stays usable. Release
# builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3
