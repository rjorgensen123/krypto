# CI for krypto on GitHub. Runs on every push to main and on pull requests.
#
# The jobs run in a container rather than on the runner directly, for one
# reason: the tests mlock memory, and the crate is fail-closed about it. With
# the default memlock limit those tests fail for the wrong reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=-1:-1
    steps:
      - uses: actions/checkout@v7

      - name: Add clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  # The rust-version that Cargo.toml promises, built and tested as it stands: a
  # promise no job checks is one nobody knows is kept. The version is read from
  # Cargo.toml, so it is written in one place only.
  msrv:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=-1:-1
    steps:
      - uses: actions/checkout@v7

      - name: Install the declared rust-version
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"

      - name: Test on the declared rust-version
        run: cargo +"$MSRV" test --locked --all-targets

  # Rust <-> Python parity: pytest drives the REAL krypto-cli as a subprocess
  # and checks every answer against an INDEPENDENT implementation
  # (cryptography/argon2-cffi/hashlib), both directions. Two implementations
  # that must agree are tested against each other — not each against itself.
  python-parity:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=-1:-1
    steps:
      - uses: actions/checkout@v7

      - name: Build krypto-cli
        run: cargo build --locked --bin krypto-cli

      # Pinned, like the Rust side: python/requirements-ci.txt fixes exact versions of
      # cryptography and argon2-cffi. These are not test dependencies — they
      # ARE the counterpart the parity tests check against.
      - name: Python + dependencies (pinned versions)
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r python/requirements-ci.txt

      - name: Parity tests (pytest)
        run: /tmp/venv/bin/pytest python/ -q

  # The Python binding (0.8.0): built with maturin and tested from Python, with
  # what crosses between Rust and Python tested both ways.
  python-binding:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=-1:-1
    steps:
      - uses: actions/checkout@v7

      # Pinned, like the Rust side: krypto-py/requirements-ci.txt fixes maturin
      # and pytest.
      - name: Python + build tools (pinned versions)
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r krypto-py/requirements-ci.txt

      - name: Clippy for krypto-py (warnings are errors)
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo clippy --locked -p krypto-py --all-targets -- -D warnings

      - name: Build and install krypto-py
        run: VIRTUAL_ENV=/tmp/venv /tmp/venv/bin/maturin develop --locked -m krypto-py/Cargo.toml

      # The same names on both sides; and Rust seals, stores, signs and hashes,
      # and krypto_py opens and checks it in a Python subprocess, then the other
      # way round.
      - name: The same API, and Rust and Python open what the other made
        run: PYO3_PYTHON=/tmp/venv/bin/python cargo test --locked -p krypto-py

      - name: krypto-py from Python (pytest)
        run: /tmp/venv/bin/pytest krypto-py/tests -q

  # Dependency audit: RustSec advisories, license allowlist, bans and source
  # control. The configuration lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pinned binary rather than a third-party action. An action runs with
      # access to this repository and can change under its own tag; a release
      # artifact at a fixed version cannot. For a crate whose whole point is not
      # trusting things unnecessarily, one fewer party in the chain is worth the
      # three extra lines.
      - name: Fetch cargo-deny
        run: |
          curl -sSfL -o /tmp/cd.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cd.tgz -C /tmp --strip-components=1
          install /tmp/cargo-deny /usr/local/bin/

      - name: cargo deny check
        run: cargo deny check

  # Miri over the unsafe/ffi layer. Miri runs no real syscalls — mlock, madvise
  # and prctl are no-ops under it (src/ffi.rs) — so what it verifies is the
  # crate's own pointer and memory handling around them: the `secret` module
  # alone. aead and store cannot run under miri (aegis is C behind FFI).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nightly + miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          rustup override set nightly

      - name: Miri (secret + harden — the tests above the unsafe layer)
        run: cargo miri test --test secret --test harden
